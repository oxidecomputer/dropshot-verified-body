[package]
name = "dropshot-verified-body"
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
github = [
  "hex",
  "sha2",
  "thiserror"
]

[dependencies]
async-trait = "0.1.89"
digest = { version = "0.11.3", features = ["mac"] }
dropshot = "0.17"
hex = { version = "0.4.3", optional = true }
hmac_ext = { package = "hmac", version = "0.13.0" }
http = "1"
hyper = "1"
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.11.0", optional = true }
thiserror = { version = "2.0.20", optional = true }
tracing = "0.1.44"
